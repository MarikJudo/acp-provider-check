# Раз в час догоняет сеть и публикует свежий индекс провайдеров и готовые отчёты в репозиторий.
# Сырые события живут в кэше Actions (при промахе — из data/seed), в git попадают индекс и отчёты data/reports/.
name: refresh-provider-index
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: index, cancel-in-progress: false }
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore raw events
        uses: actions/cache/restore@v4
        with:
          path: |
            data/events.jsonl
            data/state.json
          key: events-${{ github.run_id }}
          restore-keys: events-
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: python indexer.py
        env: { INDEX_WORKERS: "2" }
      - run: node serve/build_reports.ts
      - name: Save raw events
        uses: actions/cache/save@v4
        with:
          path: |
            data/events.jsonl
            data/state.json
          key: events-${{ github.run_id }}
      - name: Commit index
        run: |
          git config user.name "provider-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && git reset -q --soft origin/main   # если параллельный запуск успел запушить — наши свежие файлы поверх
          git add data/provider_index.json data/reports
          git diff --cached --quiet || git commit -m "index: $(date -u +%FT%TZ)"
          git push
